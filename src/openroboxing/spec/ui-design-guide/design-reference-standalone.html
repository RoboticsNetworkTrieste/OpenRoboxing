  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4a30ba67-2034-4fc7-80e3-df4b700bf0dc\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n\n<style>/* TORC webfonts — Red Hat family (the logo typeface), self-hosted woff2 subsets */\n@font-face{font-family:'Red Hat Display';font-style:normal;font-weight:500;font-display:swap;src:url(\"dd4fafd4-a80f-48ee-83bb-773fc04ca601\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Display';font-style:normal;font-weight:500;font-display:swap;src:url(\"14cf38cf-06e1-41f0-9c92-098321ba3655\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n@font-face{font-family:'Red Hat Display';font-style:normal;font-weight:600;font-display:swap;src:url(\"c72c44b8-a2fe-4f2b-b3ae-f915c908a844\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Display';font-style:normal;font-weight:600;font-display:swap;src:url(\"302c7ece-b707-473d-bf93-8b02c4e9f383\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n@font-face{font-family:'Red Hat Display';font-style:normal;font-weight:700;font-display:swap;src:url(\"c108290c-b8f4-4df6-9c12-9c7d04096feb\") format('woff2');unicode-range:U+0100-0 yle:normal;font-weight:600;font-display:swap;src:url(\"2065aca9-0f82-43a5-83df-07a1e2085f1c\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Text';font-style:normal;font-weight:600;font-display:swap;src:url(\"d03a917b-0bfa-4a90-9b0b-dd045fb90a85\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:400;font-display:swap;src:url(\"80ce8c2e-73e1-4dd0-9697-fef1827e006e\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:400;font-display:swap;src:url(\"4e39d393-a6f7-49ed-ac22-6a117eced493\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:500;font-display:swap;src:url(\"b583e5d6-7894-41ae-956b-239f092273dc\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:500;font-display:swap;src:url(\"49f06884-6307-48a5-b4c1-f6d6301ebfa7\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:600;font-display:swap;src:url(\"e400f821-4f70-4f97-a8b7-b140cfc10266\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:600;font-display:swap;src:url(\"fa5cb6e2-64f3-4f67-9458-3d5fec9ce966\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n<\u002Fstyle>\n<style>/* ── TORC palette ───────────────────────────────────────────────\n   Every value below is lifted from the delivered logo/element SVGs\n   or built as a tonal step inside that same green-tinted family.\n   TORC is a TWO-GROUND identity: ink is the operator ground (hardware,\n   heroes, dashboards, section breaks); paper is the reading ground\n   (docs, site body, content slides). Neither is a \"theme override\" of\n   the other — pick the one that matches the job. */\n:root{\n  /* Ink — green-tinted carbon. The brand's ground. */\n  --torc-ink-950:#050D0A;   /* deepest, full-bleed page ground */\n  --torc-ink-900:#08130F;   /* favicon / trace ground — canonical \"black\" */\n  --torc-ink-850:#0C1A14;   /* duotone stripe dark */\n  --torc-ink-800:#101E18;   /* surface: cards, panels */\n  --torc-ink-700:#16281F;   /* raised surface, hover fill */\n  --torc-ink-600:#1E3529;   /* strong border, inset fill */\n  --torc-ink-500:#2C4A3C;   /* hairline+, muted diagram line */\n\n  /* Sage — muted foreground steps for dark ground */\n  --torc-sage-600:#4A6E5C;\n  --torc-sage-500:#6E8C7E;  /* tertiary text on ink */\n  --torc-sage-400:#93AC9E;\n  --torc-sage-300:#B7C9BE;  /* secondary text on ink */\n\n  /* Mist — light end (belongs to the ink ground) */\n  --torc-mist-100:#EAF2ED;  /* logo light ink — primary text on ink */\n  --torc-mist-050:#F2F7F4;  /* mist tint — panels ON ink, not a page ground */\n  --torc-white:#FFFFFF;\n\n  /* Paper — warm neutral light ground. Concrete and drawing paper, never\n     white and never green-tinted: it has to sit next to ink without\n     turning cold. This is the reading half of the system. */\n  --torc-paper-050:#F8F7F3;  /* raised card on paper */\n  --torc-paper-100:#EFEDE6;  /* DEFAULT paper page ground */\n  --torc-paper-200:#E5E2D9;  /* inset, track, table stripe */\n  --torc-paper-300:#D5D1C4;  /* border on paper */\n  --torc-paper-400:#B6B1A0;  /* strong border, muted rule */\n\n  /* Clay — the warm secondary. A second temperature so section heads,\n     callouts and hero moments differ from body without shouting.\n     Surfaces, rules and punctuation only — NEVER a status colour. */\n  --torc-clay-100:#F2E4D8;   /* tinted surface on paper */\n  --torc-clay-300:#DDAE86;   /* secondary on ink */\n  --torc-clay-500:#BC7B4C;   /* secondary on paper */\n  --torc-clay-700:#8C5430;\n  --torc-clay-900:#332014;   /* clay-tinted surface on ink */\n\n  /* Deep ink for light ground (logo, wordmark-light) */\n  --torc-forest-900:#0F231B;\n  --torc-forest-700:#1C3A2D;\n\n  /* Torque green — the one accent */\n  --torc-green-200:#A6EBD2;\n  --torc-green-300:#7BE0BC;  /* hover on ink */\n  --torc-green-400:#4FD1A0;  /* ACCENT on dark ground */\n  --torc-green-500:#2FB98A;  /* ACCENT on light ground */\n  --torc-green-600:#219B72;  /* pressed */\n  --torc-green-700:#177A59;\n  --torc-green-800:#12654A;  /* accent as TEXT on paper — 4.5:1 on paper-100 */\n  --torc-green-900:#0E3A2B;  /* accent-tinted surface on ink */\n\n  /* Signals — instrument LEDs. Crisp and unmistakable against ink,\n     deliberately far from the accent hue so status never reads as brand. */\n  --torc-blue-400:#3FA9F5;   /* info */\n  --torc-blue-600:#1E7FC4;\n  --torc-blue-900:#0A2439;\n  --torc-amber-400:#FFB020;  /* warning */\n  --torc-amber-600:#C88300;\n  --torc-amber-900:#3A2705;\n  --torc-red-400:#FF5247;    /* danger */\n  --torc-red-600:#D32A1F;\n  --torc-red-900:#3B1310;\n\n  /* Alphas — hairlines, scrims, glows. Never hardcode rgba() in a design. */\n  --torc-alpha-line:rgba(234,242,237,.08);      /* default hairline on ink */\n  --torc-alpha-line-strong:rgba(234,242,237,.16);\n  --torc-alpha-grid:rgba(234,242,237,.06);      /* blueprint grid stroke */\n  --torc-alpha-tick:rgba(234,242,237,.22);      /* measurement ticks */\n  --torc-alpha-hud:rgba(234,242,237,.28);       /* HUD corner brackets */\n  --torc-alpha-fill:rgba(234,242,237,.04);      /* glass fill on ink */\n  --torc-alpha-fill-hover:rgba(234,242,237,.07);\n  --torc-alpha-accent-12:rgba(79,209,160,.12);\n  --torc-alpha-accent-24:rgba(79,209,160,.24);\n  --torc-alpha-accent-40:rgba(79,209,160,.40);\n  --torc-alpha-ink-60:rgba(8,19,15,.60);        /* scrim over imagery */\n  --torc-alpha-ink-88:rgba(8,19,15,.88);        /* sticky header scrim */\n  /* Paper-ground alphas — deep forest ink, one step stronger than their\n     ink-ground twins because light grounds swallow hairlines. */\n  --torc-alpha-line-paper:rgba(15,35,27,.14);\n  --torc-alpha-line-paper-strong:rgba(15,35,27,.26);\n  --torc-alpha-grid-paper:rgba(15,35,27,.055);\n  --torc-alpha-tick-paper:rgba(15,35,27,.34);\n  --torc-alpha-hud-paper:rgba(15,35,27,.36);\n  --torc-alpha-fill-paper:rgba(15,35,27,.035);\n  --torc-alpha-fill-paper-hover:rgba(15,35,27,.065);\n  --torc-alpha-paper-72:rgba(239,237,230,.72);  /* scrim over imagery on paper */\n  --torc-alpha-paper-90:rgba(239,237,230,.90);  /* sticky header scrim on paper */\n  --torc-alpha-clay-12:rgba(188,123,76,.12);\n  --torc-alpha-clay-28:rgba(188,123,76,.28);\n}\n<\u002Fstyle>\n<style>/* ── Type ───────────────────────────────────────────────────────\n   Red Hat Display — the logo typeface. Brand moments + all headings.\n   Red Hat Text    — body and UI. Same skeleton, tuned for small sizes.\n   Red Hat Mono    — labels, kickers, metadata, code. The \"telemetry\" voice.\n   One family, three cuts: the whole system is Red Hat. */\n:root{\n  --font-display:'Red Hat Display','Red Hat Text',system-ui,sans-serif;\n  --font-sans:'Red Hat Text','Red Hat Display',system-ui,sans-serif;\n  --font-mono:'Red Hat Mono',ui-monospace,'SF Mono',Menlo,monospace;\n\n  --fw-regular:400; /* @kind other */\n  --fw-medium:500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:700; /* @kind other */\n\n  /* Scale — 1.25 major-third-ish, rounded to whole px */\n  --text-4xs:10px;  /* HUD annotation only */\n  --text-3xs:11px;\n  --text-2xs:12px;\n  --text-xs:13px;\n  --text-sm:15px;\n  --text-md:17px;   /* body default */\n  --text-lg:20px;\n  --text-xl:24px;\n  --text-2xl:30px;\n  --text-3xl:38px;\n  --text-4xl:48px;\n  --text-5xl:62px;\n  --text-6xl:80px;\n  --text-7xl:104px; /* hero / slide titles only */\n\n  --lh-tight:1.02; /* @kind other */   /* display 4xl+ */\n  --lh-snug:1.14; /* @kind other */    /* headings */\n  --lh-normal:1.35; /* @kind other */  /* subheads, UI */\n  --lh-relaxed:1.62; /* @kind other */ /* body copy */\n\n  --ls-display:-0.035em; /* set headlines tight — machined, not airy */\n  --ls-heading:-0.02em;\n  --ls-normal:-0.005em;\n  --ls-mono:0.04em;\n  --ls-kicker:0.18em;    /* uppercase mono eyebrow */\n  --ls-hud:0.22em;       /* smallest annotation labels */\n\n  --measure-tight:34ch;\n  --measure:66ch;   /* body paragraph max */\n  --measure-wide:78ch;\n}\n<\u002Fstyle>\n<style>/* ── Space & layout ─────────────────────────────────────────────\n   4px base. The blueprint grid in the brand elements is 24px —\n   keep section rhythm on multiples of 8, page gutters on 24. */\n:root{\n  --space-0:0px;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-7:28px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-14:56px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n  --space-40:160px;\n\n  --grid-unit:48px;          /* blueprint pattern pitch */\n  --page-max:1280px;         /* content column max */\n  --page-max-wide:1600px;\n  --page-gutter:32px;\n  --page-gutter-lg:64px;\n  --section-y:128px;         /* vertical rhythm between page sections */\n  --section-y-sm:80px;\n  --control-h-sm:32px;\n  --control-h-md:40px;\n  --control-h-lg:48px;\n  --tap-min:44px;\n}\n<\u002Fstyle>\n<style>/* ── Shape ──────────────────────────────────────────────────────\n   High-end robotics geometry: machined, square, precise.\n   Nothing is soft. Radii exist only to take the raw edge off a\n   1px corner — they are never a styling gesture.\n   The one exception is the delivered app tile (22%), which is\n   part of the logo system and must not be squared. */\n:root{\n  --radius-xs:0px;\n  --radius-sm:1px;\n  --radius-md:2px;    /* controls: buttons, inputs */\n  --radius-lg:3px;    /* canonical panel / plate radius */\n  --radius-xl:4px;\n  --radius-2xl:6px;\n  --radius-tile:22%;  /* logo app tile only */\n  --radius-pill:999px;/* status pills only — never buttons */\n  --radius-circle:50%;\n\n  --border-hairline:1px;\n  --border-line:1.5px;   /* the weight used in the brand elements */\n  --border-heavy:2px;\n  --stroke-icon:1.75px;  /* icons run one notch finer than Lucide default */\n  --stroke-diagram:1.5px;\n  --focus-ring-w:1px;\n  --focus-ring-offset:2px;\n\n  /* Annotation system — HUD brackets and measurement ticks */\n  --hud-bracket:14px;    /* corner bracket arm length */\n  --tick-pitch:8px;      /* measurement tick spacing */\n  --tick-h:6px;          /* minor tick height */\n  --tick-h-major:11px;   /* every 5th tick */\n}\n<\u002Fstyle>\n<style>/* ── Elevation ──────────────────────────────────────────────────\n   Dark-first UI separates with hairlines and light, not drop shadows.\n   Shadows exist only for things that truly float (menus, dialogs).\n   The accent glow is the brand's one expressive elevation. */\n:root{\n  --shadow-none:none;\n  --shadow-sm:0 1px 2px rgba(5,13,10,.40);\n  --shadow-md:0 4px 16px -4px rgba(5,13,10,.55);\n  --shadow-lg:0 16px 44px -12px rgba(5,13,10,.70);\n  --shadow-xl:0 32px 80px -20px rgba(5,13,10,.80);\n  --shadow-inset-top:inset 0 1px 0 rgba(234,242,237,.06);\n\n  --glow-accent:0 0 0 1px rgba(79,209,160,.35),0 10px 40px -12px rgba(79,209,160,.45);\n  --glow-accent-soft:0 8px 32px -14px rgba(79,209,160,.55);\n  --glow-dot:0 0 12px rgba(79,209,160,.75);\n\n  --ring-accent:0 0 0 var(--focus-ring-w) var(--torc-green-400);\n  --ring-offset-ink:0 0 0 var(--focus-ring-offset) var(--torc-ink-900);\n}\n<\u002Fstyle>\n<style>/* ── Motion ─────────────────────────────────────────────────────\n   Mechanical, not playful: short, linear-ish easings, no bounce,\n   no spring overshoot. Things settle like a servo, not a spring. */\n:root{\n  --dur-instant:80ms; /* @kind other */\n  --dur-fast:140ms; /* @kind other */   /* hover, press */\n  --dur-base:220ms; /* @kind other */   /* enter/exit, expand */\n  --dur-slow:380ms; /* @kind other */   /* page/section reveal */\n  --dur-rotate:1100ms; /* @kind other *//* torque arc spin */\n\n  --ease-standard:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n  --ease-in:cubic-bezier(.4,0,1,1); /* @kind other */\n  --ease-servo:cubic-bezier(.33,0,.15,1); /* @kind other */ /* signature: fast start, firm stop */\n\n  --transition-control:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard); /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ── Semantic aliases ───────────────────────────────────────────\n   Design against THESE, not the raw palette.\n   :root is the dark theme (default). [data-theme=\"light\"] flips ground.  */\n:root{\n  --bg-page:var(--torc-ink-900);\n  --bg-page-deep:var(--torc-ink-950);\n  --surface-1:var(--torc-ink-800);      /* card, panel */\n  --surface-2:var(--torc-ink-700);      /* raised, hover */\n  --surface-3:var(--torc-ink-600);      /* inset, track */\n  --surface-glass:var(--torc-alpha-fill);\n  --surface-glass-hover:var(--torc-alpha-fill-hover);\n  --surface-accent:var(--torc-green-900);\n  --surface-scrim:var(--torc-alpha-ink-60);\n  --surface-header:var(--torc-alpha-ink-88);\n\n  --text-strong:var(--torc-white);\n  --text-body:var(--torc-mist-100);\n  --text-secondary:var(--torc-sage-300);\n  --text-muted:var(--torc-sage-500);\n  --text-accent:var(--torc-green-400);\n  --text-on-accent:var(--torc-ink-900);\n  --text-link:var(--torc-green-400);\n  --text-link-hover:var(--torc-green-300);\n\n  --border-subtle:var(--torc-alpha-line);\n  --border-default:var(--torc-ink-600);\n  --border-strong:var(--torc-ink-500);\n  --border-accent:var(--torc-alpha-accent-40);\n  --border-grid:var(--torc-alpha-grid);\n  --border-tick:var(--torc-alpha-tick);\n  --border-hud:var(--torc-alpha-hud);\n\n  --accent:var(--torc-green-400);\n  --accent-hover:var(--torc-green-300);\n  --accent-press:var(--torc-green-500);\n  --accent-quiet:var(--torc-alpha-accent-12);\n\n  /* Secondary — clay. The second temperature. Surfaces, rules, punctuation.\n     Never a status, never a primary action. */\n  --secondary:var(--torc-clay-300);\n  --secondary-quiet:var(--torc-alpha-clay-12);\n  --surface-secondary:var(--torc-clay-900);\n  --border-secondary:var(--torc-alpha-clay-28);\n\n  --status-ok:var(--torc-green-400);\n  --status-ok-bg:var(--torc-green-900);\n  --status-info:var(--torc-blue-400);\n  --status-info-bg:var(--torc-blue-900);\n  --status-warn:var(--torc-amber-400);\n  --status-warn-bg:var(--torc-amber-900);\n  --status-danger:var(--torc-red-400);\n  --status-danger-bg:var(--torc-red-900);\n\n  /* Quiet status — for chips and table cells, where a label must not\n     out-punch a real action. Use -quiet as the fill, -quiet-fg as the text. */\n  --status-ok-quiet:rgba(79,209,160,.10);\n  --status-ok-quiet-fg:var(--torc-green-300);\n  --status-info-quiet:rgba(63,169,245,.10);\n  --status-info-quiet-fg:#8FCBF7;\n  --status-warn-quiet:rgba(255,176,32,.10);\n  --status-warn-quiet-fg:#F5CE84;\n  --status-danger-quiet:rgba(255,82,71,.10);\n  --status-danger-quiet-fg:#F79B94;\n\n  --focus-ring:var(--torc-green-400);\n}\n/* Paper ground. Warm neutral, not white — the reading half of the system. */\n[data-theme=\"light\"]{\n  --bg-page:var(--torc-paper-100);\n  --bg-page-deep:var(--torc-paper-200);\n  --surface-1:var(--torc-paper-050);\n  --surface-2:var(--torc-white);\n  --surface-3:var(--torc-paper-200);\n  --surface-glass:var(--torc-alpha-fill-paper);\n  --surface-glass-hover:var(--torc-alpha-fill-paper-hover);\n  --surface-accent:#DCEFE5;\n  --surface-scrim:var(--torc-alpha-paper-72);\n  --surface-header:var(--torc-alpha-paper-90);\n\n  --text-strong:var(--torc-forest-900);\n  --text-body:#182E24;\n  --text-secondary:var(--torc-forest-700);\n  --text-muted:#5E7365;\n  --text-accent:var(--torc-green-700);\n  --text-on-accent:var(--torc-ink-900);\n  --text-link:var(--torc-green-700);\n  --text-link-hover:var(--torc-green-800);\n\n  --border-subtle:var(--torc-alpha-line-paper);\n  --border-default:var(--torc-paper-300);\n  --border-strong:var(--torc-paper-400);\n  --border-accent:rgba(47,185,138,.48);\n  --border-grid:var(--torc-alpha-grid-paper);\n  --border-tick:var(--torc-alpha-tick-paper);\n  --border-hud:var(--torc-alpha-hud-paper);\n\n  --accent:var(--torc-green-500);   /* FILLS AND RULES ONLY on paper — for accent-coloured\n                                      text use --text-accent (green-700), which clears 4.5:1 */\n  --accent-hover:var(--torc-green-600);\n  --accent-press:var(--torc-green-700);\n  --accent-quiet:rgba(47,185,138,.12);\n\n  --secondary:var(--torc-clay-500);\n  --secondary-quiet:var(--torc-alpha-clay-12);\n  --surface-secondary:var(--torc-clay-100);\n  --border-secondary:var(--torc-alpha-clay-28);\n\n  --status-ok:var(--torc-green-600);\n  --status-ok-bg:#DCEFE5;\n  --status-info:var(--torc-blue-600);\n  --status-info-bg:#DBE8F3;\n  --status-warn:var(--torc-amber-600);\n  --status-warn-bg:#F7EACC;\n  --status-danger:var(--torc-red-600);\n  --status-danger-bg:#F7DDD9;\n\n  --status-ok-quiet:#E3F1EA;\n  --status-ok-quiet-fg:var(--torc-green-700);\n  --status-info-quiet:#E2EBF4;\n  --status-info-quiet-fg:#175F94;\n  --status-warn-quiet:#F5EBD5;\n  --status-warn-quiet-fg:#8A5A00;\n  --status-danger-quiet:#F7E2DE;\n  --status-danger-quiet-fg:#A11F16;\n\n  --focus-ring:var(--torc-green-500);\n}\n/* Instrument density — how loud the HUD chrome runs. Full is the dashboard\n   and technical-diagram setting; quiet is site and decks; off is long-form\n   reading, where grids and ticks become noise. Set on any container. */\n[data-instrument=\"full\"]{--border-grid:var(--torc-alpha-grid);--border-tick:var(--torc-alpha-tick);--border-hud:var(--torc-alpha-hud)}\n[data-theme=\"light\"] [data-instrument=\"full\"],[data-theme=\"light\"][data-instrument=\"full\"]{--border-grid:var(--torc-alpha-grid-paper);--border-tick:var(--torc-alpha-tick-paper);--border-hud:var(--torc-alpha-hud-paper)}\n[data-instrument=\"quiet\"]{--border-grid:rgba(234,242,237,.035);--border-tick:rgba(234,242,237,.14);--border-hud:rgba(234,242,237,.18)}\n[data-theme=\"light\"] [data-instrument=\"quiet\"],[data-theme=\"light\"][data-instrument=\"quiet\"]{--border-grid:rgba(15,35,27,.03);--border-tick:rgba(15,35,27,.20);--border-hud:rgba(15,35,27,.22)}\n[data-instrument=\"off\"]{--border-grid:transparent;--border-tick:transparent;--border-hud:transparent}\n<\u002Fstyle>\n<style>/* ── Base & brand utilities ─────────────────────────────────────\n   Element defaults + the handful of brand backgrounds that would\n   otherwise be re-invented in every design. */\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);font-size:var(--text-md);line-height:var(--lh-relaxed);font-weight:var(--fw-regular);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nh1,h2,h3,h4,h5{font-family:var(--font-display);font-weight:var(--fw-semibold);color:var(--text-strong);margin:0;text-wrap:balance}\nh1{font-size:var(--text-4xl);line-height:var(--lh-tight);letter-spacing:var(--ls-display)}\nh2{font-size:var(--text-2xl);line-height:var(--lh-snug);letter-spacing:var(--ls-heading)}\nh3{font-size:var(--text-xl);line-height:var(--lh-snug);letter-spacing:var(--ls-heading)}\nh4{font-size:var(--text-lg);line-height:var(--lh-normal);letter-spacing:var(--ls-heading)}\nh5{font-size:var(--text-md);line-height:var(--lh-normal)}\np{margin:0;text-wrap:pretty}\na{color:var(--text-link);text-decoration:none;text-underline-offset:3px;transition:color var(--dur-fast) var(--ease-standard)}\na:hover{color:var(--text-link-hover);text-decoration:underline}\na:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:var(--focus-ring-w) solid var(--focus-ring);outline-offset:var(--focus-ring-offset)}\ncode,kbd,pre,samp{font-family:var(--font-mono);font-size:.925em;font-variant-numeric:tabular-nums}\nhr{border:0;border-top:var(--border-hairline) solid var(--border-subtle);margin:var(--space-8) 0}\n::selection{background:var(--torc-alpha-accent-24);color:var(--text-strong)}\nimg,svg,video{max-width:100%}\nbutton{font:inherit}\n:root{color-scheme:dark}\n[data-theme=\"light\"]{color-scheme:light}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n\n/* Mono eyebrow / kicker — the brand's signature label treatment */\n.torc-kicker{font-family:var(--font-mono);font-size:var(--text-3xs);font-weight:var(--fw-medium);letter-spacing:var(--ls-kicker);text-transform:uppercase;color:var(--text-accent);font-variant-numeric:tabular-nums}\n.torc-kicker--muted{color:var(--text-muted)}\n/* HUD annotation label — the smallest voice in the system */\n.torc-hud-label{font-family:var(--font-mono);font-size:var(--text-4xs);font-weight:var(--fw-medium);letter-spacing:var(--ls-hud);text-transform:uppercase;color:var(--text-muted);font-variant-numeric:tabular-nums}\n\n/* Machined corner brackets — frames a plate or a figure */\n.torc-hud{position:relative}\n.torc-hud::before,.torc-hud::after{content:\"\";position:absolute;width:var(--hud-bracket);height:var(--hud-bracket);pointer-events:none}\n.torc-hud::before{top:0;left:0;border-top:var(--border-hairline) solid var(--border-hud);border-left:var(--border-hairline) solid var(--border-hud)}\n.torc-hud::after{bottom:0;right:0;border-bottom:var(--border-hairline) solid var(--border-hud);border-right:var(--border-hairline) solid var(--border-hud)}\n\n/* Measurement tick strip — the precision motif. Height = --tick-h-major */\n.torc-ticks{height:var(--tick-h-major);background-image:repeating-linear-gradient(90deg,var(--border-tick) 0 1px,transparent 1px var(--tick-pitch));background-position:bottom left;background-repeat:repeat-x;background-size:100% var(--tick-h)}\n.torc-ticks--major{background-image:repeating-linear-gradient(90deg,var(--border-tick) 0 1px,transparent 1px calc(var(--tick-pitch) * 5)),repeating-linear-gradient(90deg,var(--border-tick) 0 1px,transparent 1px var(--tick-pitch));background-size:100% var(--tick-h-major),100% var(--tick-h)}\n\n/* Full-bleed hairline that a section index sits on */\n.torc-bleed-rule{display:flex;align-items:center;gap:var(--space-4);border-top:var(--border-hairline) solid var(--border-subtle);padding-top:var(--space-3)}\n\n/* Blueprint grid ground — finer and dimmer than before: structure you sense, not see */\n.torc-grid{background-color:var(--bg-page);background-image:linear-gradient(var(--border-grid) var(--border-hairline),transparent var(--border-hairline)),linear-gradient(90deg,var(--border-grid) var(--border-hairline),transparent var(--border-hairline));background-size:var(--grid-unit) var(--grid-unit)}\n/* 45° duotone stripe ground (matches torc-element-duotone.svg) */\n.torc-stripes{background:repeating-linear-gradient(45deg,var(--torc-ink-850) 0 9px,var(--torc-ink-800) 9px 18px)}\n[data-theme=\"light\"] .torc-stripes{background:repeating-linear-gradient(45deg,var(--torc-paper-200) 0 9px,var(--torc-paper-050) 9px 18px)}\n/* Accent hairline rule with a lit end — used under section headers */\n.torc-rule{height:var(--border-hairline);background:linear-gradient(90deg,var(--torc-ink-500),var(--torc-green-400));border:0}\n[data-theme=\"light\"] .torc-rule{background:linear-gradient(90deg,var(--torc-paper-400),var(--torc-green-500))}\n/* Same rule in the warm secondary — a section head that must not read as an action */\n.torc-rule--secondary{background:linear-gradient(90deg,var(--border-strong),var(--secondary))}\n.torc-hairline{border:var(--border-hairline) solid var(--border-subtle)}\n<\u002Fstyle>\n<style>/* ── Grounds: layered technical fields ──────────────────────────\n   A ground is never a single flat fill. `.torc-field` composes four\n   layers, in paint order: scrim → wash → art → grain → base colour.\n   Each layer is ONE background-image, driven by one custom property,\n   so the four lists below always stay aligned.\n\n   Variants are data attributes, not classes, so every declaration\n   of a --field-* property lives in a [data-*] scope:\n     data-field=\"survey|contour|schematic|scan|strata\"   the drawn field\n     data-field-glow=\"lit|wash\"                          directional wash\n     data-field-depth=\"open|deep|hero\"                   how hard the scrim bites\n     data-field-edge=\"horizon\"                           hairline of light on a band join\n\n   Every field exists on BOTH grounds. On ink the art is drawn in light\n   strokes and the veil darkens toward the edges; U+FFFD}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:600;font-display:swap;src:url(\"e400f821-4f70-4f97-a8b7-b140cfc10266\") format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}\n@font-face{font-family:'Red Hat Mono';font-style:normal;font-weight:600;font-display:swap;src:url(\"fa5cb6e2-64f3-4f67-9458-3d5fec9ce966\") format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}\n\n/* ── TORC palette ───────────────────────────────────────────────\n   Every value below is lifted from the delivered logo/element SVGs\n   or built as a tonal step inside that same green-tinted family.\n   TORC is a TWO-GROUND identity: ink is the operator ground (hardware,\n   heroes, dashboards, section breaks); paper is the reading ground\n   (docs, site body, content slides). Neither is a \"theme override\" of\n   the other — pick the one that matches the job. */\n:root{\n  /* Ink — green-tinted carbon. The brand's ground. */\n  --torc-ink-950:#050D0A;   /* deepest, full-bleed page ground */\n  --torc-ink-900:#08130F;   /* favicon / trace ground — canonical \"black\" */\n  --torc-ink-850:#0C1A14;   /* duotone stripe dark */\n  --torc-ink-800:#101E18;   /* surface: cards, panels */\n  --torc-ink-700:#16281F;   /* raised surface, hover fill */\n  --torc-ink-600:#1E3529;   /* strong border, inset fill */\n  --torc-ink-500:#2C4A3C;   /* hairline+, muted diagram line */\n\n  /* Sage — muted foreground steps for dark ground */\n  --torc-sage-600:#4A6E5C;\n  --torc-sage-500:#6E8C7E;  /* tertiary text on ink */\n  --torc-sage-400:#93AC9E;\n  --torc-sage-300:#B7C9BE;  /* secondary text on ink */\n\n  /* Mist — light end (belongs to the ink ground) */\n  --torc-mist-100:#EAF2ED;  /* logo light ink — primary text on ink */\n  --torc-mist-050:#F2F7F4;  /* mist tint — panels ON ink, not a page ground */\n  --torc-white:#FFFFFF;\n\n  /* Paper — warm neutral light ground. Concrete and drawing paper, never\n     white and never green-tinted: it has to sit next to ink without\n     turning cold. This is the reading half of the system. */\n  --torc-paper-050:#F8F7F3;  /* raised card on paper */\n  --torc-paper-100:#EFEDE6;  /* DEFAULT paper page ground */\n  --torc-paper-200:#E5E2D9;  /* inset, track, table stripe */\n  --torc-paper-300:#D5D1C4;  /* border on paper */\n  --torc-paper-400:#B6B1A0;  /* strong border, muted rule */\n\n  /* Clay — the warm secondary. A second temperature so section heads,\n     callouts and hero moments differ from body without shouting.\n     Surfaces, rules and punctuation only — NEVER a status colour. */\n  --torc-clay-100:#F2E4D8;   /* tinted surface on paper */\n  --torc-clay-300:#DDAE86;   /* secondary on ink */\n  --torc-clay-500:#BC7B4C;   /* secondary on paper */\n  --torc-clay-700:#8C5430;\n  --torc-clay-900:#332014;   /* clay-tinted surface on ink */\n\n  /* Deep ink for light ground (logo, wordmark-light) */\n  --torc-forest-900:#0F231B;\n  --torc-forest-700:#1C3A2D;\n\n  /* Torque green — the one accent */\n  --torc-green-200:#A6EBD2;\n  --torc-green-300:#7BE0BC;  /* hover on ink */\n  --torc-green-400:#4FD1A0;  /* ACCENT on dark ground */\n  --torc-green-500:#2FB98A;  /* ACCENT on light ground */\n  --torc-green-600:#219B72;  /* pressed */\n  --torc-green-700:#177A59;\n  --torc-green-800:#12654A;  /* accent as TEXT on paper — 4.5:1 on paper-100 */\n  --torc-green-900:#0E3A2B;  /* accent-tinted surface on ink */\n\n  /* Signals — instrument LEDs. Crisp and unmistakable against ink,\n     deliberately far from the accent hue so status never reads as brand. */\n  --torc-blue-400:#3FA9F5;   /* info */\n  --torc-blue-600:#1E7FC4;\n  --torc-blue-900:#0A2439;\n  --torc-amber-400:#FFB020;  /* warning */\n  --torc-amber-600:#C88300;\n  --torc-amber-900:#3A2705;\n  --torc-red-400:#FF5247;    /* danger */\n  --torc-red-600:#D32A1F;\n  --torc-red-900:#3B1310;\n\n  /* Alphas — hairlines, scrims, glows. Never hardcode rgba() in a design. */\n  --torc-alpha-line:rgba(234,242,237,.08);      /* default hairline on ink */\n  --torc-alpha-line-strong:rgba(234,242,237,.16);\n  --torc-alpha-grid:rgba(234,242,237,.06);      /* blueprint grid stroke */\n  --torc-alpha-tick:rgba(234,242,237,.22);      /* measurement ticks */\n  --torc-alpha-hud:rgba(234,242,237,.28);       /* HUD corner brackets */\n  --torc-alpha-fill:rgba(234,242,237,.04);      /* glass fill on ink */\n  --torc-alpha-fill-hover:rgba(234,242,237,.07);\n  --torc-alpha-accent-12:rgba(79,209,160,.12);\n  --torc-alpha-accent-24:rgba(79,209,160,.24);\n  --torc-alpha-accent-40:rgba(79,209,160,.40);\n  --torc-alpha-ink-60:rgba(8,19,15,.60);        /* scrim over imagery */\n  --torc-alpha-ink-88:rgba(8,19,15,.88);        /* sticky header scrim */\n  /* Paper-ground alphas — deep forest ink, one step stronger than their\n     ink-ground twins because light grounds swallow hairlines. */\n  --torc-alpha-line-paper:rgba(15,35,27,.14);\n  --torc-alpha-line-paper-strong:rgba(15,35,27,.26);\n  --torc-alpha-grid-paper:rgba(15,35,27,.055);\n  --torc-alpha-tick-paper:rgba(15,35,27,.34);\n  --torc-alpha-hud-paper:rgba(15,35,27,.36);\n  --torc-alpha-fill-paper:rgba(15,35,27,.035);\n  --torc-alpha-fill-paper-hover:rgba(15,35,27,.065);\n  --torc-alpha-paper-72:rgba(239,237,230,.72);  /* scrim over imagery on paper */\n  --torc-alpha-paper-90:rgba(239,237,230,.90);  /* sticky header scrim on paper */\n  --torc-alpha-clay-12:rgba(188,123,76,.12);\n  --torc-alpha-clay-28:rgba(188,123,76,.28);\n}\n\n/* ── Type ───────────────────────────────────────────────────────\n   Red Hat Display — the logo typeface. Brand moments + all headings.\n   Red Hat Text    — body and UI. Same skeleton, tuned for small sizes.\n   Red Hat Mono    — labels, kickers, metadata, code. The \"telemetry\" voice.\n   One family, three cuts: the whole system is Red Hat. */\n:root{\n  --font-display:'Red Hat Display','Red Hat Text',system-ui,sans-serif;\n  --font-sans:'Red Hat Text','Red Hat Display',system-ui,sans-serif;\n  --font-mono:'Red Hat Mono',ui-monospace,'SF Mono',Menlo,monospace;\n\n  --fw-regular:400; /* @kind other */\n  --fw-medium:500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:700; /* @kind other */\n\n  /* Scale — 1.25 major-third-ish, rounded to whole px */\n  --text-4xs:10px;  /* HUD annotation only */\n  --text-3xs:11px;\n  --text-2xs:12px;\n  --text-xs:13px;\n  --text-sm:15px;\n  --text-md:17px;   /* body default */\n  --text-lg:20px;\n  --text-xl:24px;\n  --text-2xl:30px;\n  --text-3xl:38px;\n  --text-4xl:48px;\n  --text-5xl:62px;\n  --text-6xl:80px;\n  --text-7xl:104px; /* hero / slide titles only */\n\n  --lh-tight:1.02; /* @kind other */   /* display 4xl+ */\n  --lh-snug:1.14; /* @kind other */    /* headings */\n  --lh-normal:1.35; /* @kind other */  /* subheads, UI */\n  --lh-relaxed:1.62; /* @kind other */ /* body copy */\n\n  --ls-display:-0.035em; /* set headlines tight — machined, not airy */\n  --ls-heading:-0.02em;\n  --ls-normal:-0.005em;\n  --ls-mono:0.04em;\n  --ls-kicker:0.18em;    /* uppercase mono eyebrow */\n  --ls-hud:0.22em;       /* smallest annotation labels */\n\n  --measure-tight:34ch;\n  --measure:66ch;   /* body paragraph max */\n  --measure-wide:78ch;\n}\n\n/* ── Space & layout ─────────────────────────────────────────────\n   4px base. The blueprint grid in the brand elements is 24px —\n   keep section rhythm on multiples of 8, page gutters on 24. */\n:root{\n  --space-0:0px;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-7:28px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-14:56px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n  --space-40:160px;\n\n  --grid-unit:48px;          /* blueprint pattern pitch */\n  --page-max:1280px;         /* content column max */\n  --page-max-wide:1600px;\n  --page-gutter:32px;\n  --page-gutter-lg:64px;\n  --section-y:128px;         /* vertical rhythm between page sections */\n  --section-y-sm:80px;\n  --control-h-sm:32px;\n  --control-h-md:40px;\n  --control-h-lg:48px;\n  --tap-min:44px;\n}\n\n/* ── Shape ──────────────────────────────────────────────────────\n   High-end robotics geometry: machined, square, precise.\n   Nothing is soft. Radii exist only to take the raw edge off a\n   1px corner — they are never a styling gesture.\n   The one exception is the delivered app tile (22%), which is\n   part of the logo system and must not be squared. */\n:root{\n  --radius-xs:0px;\n  --radius-sm:1px;\n  --radius-md:2px;    /* controls: buttons, inputs */\n  --radius-lg:3px;    /* canonical panel / plate radius */\n  --radius-xl:4px;\n  --radius-2xl:6px;\n  --radius-tile:22%;  /* logo app tile only */\n  --radius-pill:999px;/* status pills only — never buttons */\n  --radius-circle:50%;\n\n  --border-hairline:1px;\n  --border-line:1.5px;   /* the weight used in the brand elements */\n  --border-heavy:2px;\n  --stroke-icon:1.75px;  /* icons run one notch finer than Lucide default */\n  --stroke-diagram:1.5px;\n  --focus-ring-w:1px;\n  --focus-ring-offset:2px;\n\n  /* Annotation system — HUD brackets and measurement ticks */\n  --hud-bracket:14px;    /* corner bracket arm length */\n  --tick-pitch:8px;      /* measurement tick spacing */\n  --tick-h:6px;          /* minor tick height */\n  --tick-h-major:11px;   /* every 5th tick */\n}\n\n/* ── Elevation ──────────────────────────────────────────────────\n   Dark-first UI separates with hairlines and light, not drop shadows.\n   Shadows exist only for things that truly float (menus, dialogs).\n   The accent glow is the brand's one expressive elevation. */\n:root{\n  --shadow-none:none;\n  --shadow-sm:0 1px 2px rgba(5,13,10,.40);\n  --shadow-md:0 4px 16px -4px rgba(5,13,10,.55);\n  --shadow-lg:0 16px 44px -12px rgba(5,13,10,.70);\n  --shadow-xl:0 32px 80px -20px rgba(5,13,10,.80);\n  --shadow-inset-top:inset 0 1px 0 rgba(234,242,237,.06);\n\n  --glow-accent:0 0 0 1px rgba(79,209,160,.35),0 10px 40px -12px rgba(79,209,160,.45);\n  --glow-accent-soft:0 8px 32px -14px rgba(79,209,160,.55);\n  --glow-dot:0 0 12px rgba(79,209,160,.75);\n\n  --ring-accent:0 0 0 var(--focus-ring-w) var(--torc-green-400);\n  --ring-offset-ink:0 0 0 var(--focus-ring-offset) var(--torc-ink-900);\n}\n\n/* ── Motion ─────────────────────────────────────────────────────\n   Mechanical, not playful: short, linear-ish easings, no bounce,\n   no spring overshoot. Things settle like a servo, not a spring. */\n:root{\n  --dur-instant:80ms; /* @kind other */\n  --dur-fast:140ms; /* @kind other */   /* hover, press */\n  --dur-base:220ms; /* @kind other */   /* enter/exit, expand */\n  --dur-slow:380ms; /* @kind other */   /* page/section reveal */\n  --dur-rotate:1100ms; /* @kind other *//* torque arc spin */\n\n  --ease-standard:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n  --ease-in:cubic-bezier(.4,0,1,1); /* @kind other */\n  --ease-servo:cubic-bezier(.33,0,.15,1); /* @kind other */ /* signature: fast start, firm stop */\n\n  --transition-control:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard); /* @kind other */\n}\n\n/* ── Semantic aliases ───────────────────────────────────────────\n   Design against THESE, not the raw palette.\n   :root is the dark theme (default). [data-theme=\"light\"] flips ground.  */\n:root{\n  --bg-page:var(--torc-ink-900);\n  --bg-page-deep:var(--torc-ink-950);\n  --surface-1:var(--torc-ink-800);      /* card, panel */\n  --surface-2:var(--torc-ink-700);      /* raised, hover */\n  --surface-3:var(--torc-ink-600);      /* inset, track */\n  --surface-glass:var(--torc-alpha-fill);\n  --surface-glass-hover:var(--torc-alpha-fill-hover);\n  --surface-accent:var(--torc-green-900);\n  --surface-scrim:var(--torc-alpha-ink-60);\n  --surface-header:var(--torc-alpha-ink-88);\n\n  --text-strong:var(--torc-white);\n  --text-body:var(--torc-mist-100);\n  --text-secondary:var(--torc-sage-300);\n  --text-muted:var(--torc-sage-500);\n  --text-accent:var(--torc-green-400);\n  --text-on-accent:var(--torc-ink-900);\n  --text-link:var(--torc-green-400);\n  --text-link-hover:var(--torc-green-300);\n\n  --border-subtle:var(--torc-alpha-line);\n  --border-default:var(--torc-ink-600);\n  --border-strong:var(--torc-ink-500);\n  --border-accent:var(--torc-alpha-accent-40);\n  --border-grid:var(--torc-alpha-grid);\n  --border-tick:var(--torc-alpha-tick);\n  --border-hud:var(--torc-alpha-hud);\n\n  --accent:var(--torc-green-400);\n  --accent-hover:var(--torc-green-300);\n  --accent-press:var(--torc-green-500);\n  --accent-quiet:var(--torc-alpha-accent-12);\n\n  /* Secondary — clay. The second temperature. Surfaces, rules, punctuation.\n     Never a status, never a primary action. */\n  --secondary:var(--torc-clay-300);\n  --secondary-quiet:var(--torc-alpha-clay-12);\n  --surface-secondary:var(--torc-clay-900);\n  --border-secondary:var(--torc-alpha-clay-28);\n\n  --status-ok:var(--torc-green-400);\n  --status-ok-bg:var(--torc-green-900);\n  --status-info:var(--torc-blue-400);\n  --status-info-bg:var(--torc-blue-900);\n  --status-warn:var(--torc-amber-400);\n  --status-warn-bg:var(--torc-amber-900);\n  --status-danger:var(--torc-red-400);\n  --status-danger-bg:var(--torc-red-900);\n\n  /* Quiet status — for chips and table cells, where a label must not\n     out-punch a real action. Use -quiet as the fill, -quiet-fg as the text. */\n  --status-ok-quiet:rgba(79,209,160,.10);\n  --status-ok-quiet-fg:var(--torc-green-300);\n  --status-info-quiet:rgba(63,169 */\n.torc-stripes{background:repeating-linear-gradient(45deg,var(--torc-ink-850) 0 9px,var(--torc-ink-800) 9px 18px)}\n[data-theme=\"light\"] .torc-stripes{background:repeating-linear-gradient(45deg,var(--torc-paper-200) 0 9px,var(--torc-paper-050) 9px 18px)}\n/* Accent hairline rule with a lit end — used under section headers */\n.torc-rule{height:var(--border-hairline);background:linear-gradient(90deg,var(--torc-ink-500),var(--torc-green-400));border:0}\n[data-theme=\"light\"] .torc-rule{background:linear-gradient(90deg,var(--torc-paper-400),var(--torc-green-500))}\n/* Same rule in the warm secondary — a section head that must not read as an action */\n.torc-rule--secondary{background:linear-gradient(90deg,var(--border-strong),var(--secondary))}\n.torc-hairline{border:var(--border-hairline) solid var(--border-subtle)}\n\n/* ── Grounds: layered technical fields ──────────────────────────\n   A ground is never a single flat fill. `.torc-field` composes four\n   layers, in paint order: scrim → wash → art → grain → base colour.\n   Each layer is ONE background-image, driven by one custom property,\n   so the four lists below always stay aligned.\n\n   Variants are data attributes, not classes, so every declaration\n   of a --field-* property lives in a [data-*] scope:\n     data-field=\"survey|contour|schematic|scan|strata\"   the drawn field\n     data-field-glow=\"lit|wash\"                          directional wash\n     data-field-depth=\"open|deep|hero\"                   how hard the scrim bites\n     data-field-edge=\"horizon\"                           hairline of light on a band join\n\n   Every field exists on BOTH grounds. On ink the art is drawn in light\n   strokes and the veil darkens toward the edges; on paper (set\n   data-theme=\"light\") the art is drawn in forest ink and the veil\n   LIGHTENS toward the edges, so the ground still recedes. */\n:root{\n  --field-art:none; /* @kind other */\n  --field-glow:none; /* @kind other */\n  --field-art-size:cover; /* @kind other */\n  --field-art-pos:center; /* @kind other */\n  --field-art-repeat:no-repeat; /* @kind other */\n  --field-grain:url(\"dce74dc5-3a57-44e2-950d-b8920d519c99\"); /* @kind other */\n  --field-veil:radial-gradient(120% 100% at 50% 38%,rgba(8,19,15,0) 0%,rgba(8,19,15,.22) 58%,rgba(5,13,10,.62) 100%); /* @kind other */\n}\n.torc-field{\n  background-color:var(--bg-page);\n  background-image:var(--field-veil),var(--field-glow),var(--field-art),var(--field-grain);\n  background-repeat:no-repeat,no-repeat,var(--field-art-repeat),repeat;\n  background-position:center,center,var(--field-art-pos),0 0;\n  background-size:cover,cover,var(--field-art-size),160px 160px;\n}\n/* Art — the drawn field */\n[data-field=\"survey\"]{--field-art:url(\"8adb9cbc-254c-4d7e-9014-ce4be61f87da\"); /* @kind other */--field-art-size:240px 240px; /* @kind other */--field-art-repeat:repeat; /* @kind other */}\n[data-field=\"contour\"]{--field-art:url(\"4af1999d-1f3b-4fe7-8184-5cefb79764eb\"); /* @kind other */}\n[data-field=\"schematic\"]{--field-art:url(\"4538cb1a-9af9-446d-823a-1e1bdf1dd0e9\"); /* @kind other */}\n[data-field=\"scan\"]{--field-art:url(\"0f762b4b-a3e1-4353-afdf-fbe55572113b\"); /* @kind other */}\n[data-field=\"strata\"]{--field-art:url(\"cc852e42-7846-4e2e-a487-b656932c98a2\"); /* @kind other */--field-art-size:100% auto; /* @kind other */--field-art-pos:center bottom; /* @kind other */}\n/* Glow — a single directional wash. Never a halo around an element. */\n[data-field-glow=\"lit\"]{--field-glow:radial-gradient(72% 58% at 10% 106%,var(--torc-alpha-accent-12) 0%,transparent 72%); /* @kind other */}\n[data-field-glow=\"wash\"]{--field-glow:radial-gradient(92% 72% at 80% -12%,rgba(234,242,237,.055) 0%,transparent 66%); /* @kind other */}\n/* Depth — how hard the scrim bites. Default sits between open and deep.\n   hero runs the scrim bottom-up, for titles set low on the surface. */\n[data-field-depth=\"open\"]{--field-veil:radial-gradient(140% 115% at 50% 40
