<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Stand-in for the delivered TORC grain tile: the bundle in spec/ui-design-guide/ ships the
       token sheets that reference this art but not the art itself. Same size and paint order the
       sheet expects (160 x 160, repeating, barely there). -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="160" height="160" filter="url(#g)" opacity="0.035"/>
</svg>
